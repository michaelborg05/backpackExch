profiles:
  default:
    enabled: true
    api_key_env: BACKPACK_API_KEY
    secret_env: SECRET
    take_profit_pct: 2
    stop_loss_pct: 2
    max_risk_pct: 0.25
    trailing_stop_pct: 0.8
    arm_trailing_stop_pct: 0.6
    use_trailing_stop: true
    max_position_size: 25
    default_order_size_pct: 25
    use_trend_filter: true
    trend_timeframe: "60"  # Check 60 (1hr) trend for 15m trades
    trend_indicators:
      - type: "ema_alignment"
        params: {fast: 20, slow: 50}
        weight: 1  # Optional: give more weight to certain indicators
      - type: "rsi_threshold"
        params: 
          period: 14
          min_value: 50          # Traditional threshold
          use_momentum: true     # Enable momentum detection
          early_threshold: 40    # Catch early momentum (RSI > 40 + increasing)
        weight: 1
      - type: "price_vs_vwap"
        params: {}
        weight: 1
    min_indicators_required: 2  # Need 2/3 indicators bullish
    use_atr_filter: false

  15m_MB:
    enabled: true
    api_key_env: BP_API_KEY_15M
    secret_env: BP_SECRET_15M
    take_profit_pct: 1.1
    stop_loss_pct: 0.7
    trailing_stop_pct: 0.7
    arm_trailing_stop_pct: 0.6
    use_trailing_stop: true
    max_risk_pct: 0.25
    max_position_size: 10
    default_order_size_pct: 20
    # Trend filter settings
    use_trend_filter: true
    trend_timeframe: "60"  # Check 60 (1hr) trend for 15m trades
    trend_indicators:
      - type: "ema_alignment"
        params: {fast: 20, slow: 50}
        weight: 1  # Optional: give more weight to certain indicators
      - type: "rsi_threshold"
        params: 
          period: 14
          min_value: 50          # Traditional threshold
          use_momentum: true     # Enable momentum detection
          early_threshold: 37    # Catch early momentum (RSI > 40 + increasing)
        weight: 1
      - type: "price_vs_vwap"
        params: {}
        weight: 1
    min_indicators_required: 2  # Need 2/3 indicators bullish
    use_atr_filter: true
    atr_timeframe: "15m"  # Match trading timeframe
    atr_threshold: 1.05   # ATR must be > 1.05 * ATR_SMA
    atr_filter_mode: "require_high"  # or "require_low" or "disabled"

  1hr_MB:
    enabled: false
    api_key_env: BP_API_KEY_1H
    secret_env: BP_SECRET_1H
    take_profit_pct: 2
    stop_loss_pct: 2.0
    trailing_stop_pct: 2.0
    arm_trailing_stop_pct: 1
    use_trailing_stop: true
    max_position_size: 10
    max_risk_pct: 1.0
    default_order_size_pct: 20
    # Trend filter settings - more conservative (all must pass)
    use_trend_filter: false
    trend_timeframe: "240"  # Check 240 (4H) trend for 1H trades
    trend_indicators:
      - type: "ema_alignment"
        params: {fast: 20, slow: 50}
      - type: "rsi_threshold"
        params: 
          period: 14
          min_value: 50          # Traditional threshold
          use_momentum: true     # Enable momentum detection
          early_threshold: 40    # Catch early momentum (RSI > 40 + increasing)
      - type: "price_vs_vwap"
        params: {}
    min_indicators_required: 3  # All 3 must be bullish (more conservative)
    use_atr_filter: false
    atr_timeframe: "1h"
    atr_threshold: 0.95       # Below average
    atr_filter_mode: "require_low"

  1m_MB:
    enabled: true
    api_key_env: BP_API_KEY_1M
    secret_env: BP_SECRET_1M
    take_profit_pct: 0.6
    stop_loss_pct: 0.4
    trailing_stop_pct: 0.4
    arm_trailing_stop_pct: 0.3
    use_trailing_stop: true
    max_position_size: 10
    max_risk_pct: 1.0
    default_order_size_pct: 20
    use_trend_filter: true
    trend_timeframe: "60" 
    trend_indicators:
      - type: "rsi_threshold"
        params: 
          period: 14
          min_value: 45
          use_momentum: true
          early_threshold: 35
    min_indicators_required: 1
    # ATR filter for scalping - CRITICAL for 1m trades
    use_atr_filter: false
    atr_timeframe: "1m"
    atr_threshold: 1.1    # Require 10% above average volatility
    atr_filter_mode: "require_high"  # Only trade when volatility is elevated
    # Optional: could also set max ATR to avoid extreme volatility
    # atr_max_threshold: 2.0  # Don't trade if ATR > 2.0 * ATR_SMA

  1m_MB_ATR:
    enabled: true
    api_key_env: BP_API_KEY_1M_ATR
    secret_env: BP_SECRET_1M_ATR
    take_profit_pct: 0.8
    stop_loss_pct: 0.4
    trailing_stop_pct: 0.4
    arm_trailing_stop_pct: 0.3
    use_trailing_stop: true
    max_position_size: 10
    max_risk_pct: 1.0
    default_order_size_pct: 20
    use_trend_filter: true
    trend_timeframe: "60" 
    trend_indicators:
      - type: "rsi_threshold"
        params: 
          period: 14
          min_value: 45
          use_momentum: true
          early_threshold: 35
    min_indicators_required: 1
    # ATR filter for scalping - CRITICAL for 1m trades
    use_atr_filter: true
    atr_timeframe: "1m"
    atr_threshold: 1.1    # Require 10% above average volatility
    atr_filter_mode: "require_high"  # Only trade when volatility is elevated
    # Optional: could also set max ATR to avoid extreme volatility
    # atr_max_threshold: 2.0  # Don't trade if ATR > 2.0 * ATR_SMA    