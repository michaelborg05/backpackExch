profiles:
  default:
    enabled: true
    api_key_env: BACKPACK_API_KEY
    secret_env: SECRET

    take_profit_pct: 1.2
    stop_loss_pct: 0.7
    trailing_stop_pct: 0.8
    arm_trailing_stop_pct: 0.7
    use_trailing_stop: true

    #position sizing
    default_order_size_usdc: 100.0      # Buy $100 per order
    max_position_size_pct: 40.0         # Max 40% of portfolio per symbol
    
    # Risk management
    max_open_positions: 3               # Max concurrent positions per token
    max_portfolio_exposure_pct: 100.0    # Max 100% in positions total

    use_market_regime_filter: true

    # 🎯 SIGNAL GENERATION SETTINGS (NEW)
    enable_signal_generation: true    # Enable automated signal generation
    signal_timeframe: "15"           # Timeframe for entry signals
    signal_cooldown_seconds: 600      # Wait 10min between signals for same symbol
    min_signal_confidence: 70.0       # Only trade signals >= 75% confidence
    min_volume_ratio: 1.1             # Require 10% above average volume

    # Trend filters
    use_trend_filter: true
    trend_timeframe: "60"  # Check 60 (1hr) trend for 15m trades
    trend_indicators:
      - type: "ema_slope"  # NEW: Ensure 60m trend is rising
        params:
          ema: 50
          direction: "not_falling"
          min_slope_pct: 0.01
      - type: "ema_slope"  # NEW: Ensure 60m trend is rising
        params:
          ema: 20
          direction: "rising"
          min_slope_pct: 0.02
      - type: "rsi_threshold"
        params: 
          period: 14
          min_value: 52
          use_momentum: true
          early_threshold: 40
      - type: "price_vs_vwap"
        params: {}
    min_indicators_required: 3  # Require 3/4 (stricter)

    use_entry_filter: true
    entry_timeframe: "15"  # Same as signal_timeframe for single-TF strategy
    entry_indicators:
      - type: "price_vs_ema"  # NEW: Price must be at/above EMA20
        params:
          ema: 20
          min_gap_pct: 0.0
          max_gap_pct: 1.5
      - type: "ema_slope"  # NEW: Ensure 15m trend is rising
        params:
          ema: 20
          direction: "rising"
          min_slope_pct: 0.02
      - type: "ema_slope"  # NEW: Ensure 15m trend is rising
        params:
          ema: 50
          direction: "not_falling"
          min_slope_pct: 0.01
      - type: "rsi_threshold"
        params:
          period: 14
          min_value: 53
          use_momentum: true
          early_threshold: 40
          hard_stop: true
      - type: "price_vs_vwap"
        params: {}
    min_entry_indicators_required: 4

    # ATR filter (volatility)
    use_atr_filter: false
     # Trend-based exit (intelligent)
    use_trend_invalidation_exit: true
    min_position_age_for_trend_check: 6  # hours
    # Time-based invalidation and max position backstop (last resort)
    max_position_hours: 18  # Force exit if stuck
    
  15m_MB:
    enabled: true
    api_key_env: BP_API_KEY_15M
    secret_env: BP_SECRET_15M
    take_profit_pct: 1.2
    stop_loss_pct: 1
    trailing_stop_pct: 1
    arm_trailing_stop_pct: 0.7
    use_trailing_stop: true

    #position sizing
    default_order_size_usdc: 100.0      # Buy $100 per order
    max_position_size_pct: 40.0         # Max 40% of portfolio per symbol
    
    # Risk management
    max_open_positions: 3               # Max 5 concurrent positions PER symbol
    max_portfolio_exposure_pct: 100.0    # Max 80% in positions total

    use_market_regime_filter: true

    # Trend filter settings
    use_trend_filter: true
    trend_timeframe: "60"  # Check 60 (1hr) trend for 15m trades
    trend_indicators:
      - type: "ema_cross"
        params: {fast: 20, slow: 50}
      - type: "ema_slope"  # NEW: Ensure 60m trend is rising
        params:
          ema: 20
          direction: "rising"
          min_slope_pct: 0.01
      - type: "rsi_threshold"
        params: 
          period: 14
          min_value: 50
          use_momentum: true
          early_threshold: 35
      - type: "price_vs_vwap"
        params: {}
    min_indicators_required: 3
    
    use_atr_filter: false

  1hr_MB:
    enabled: true
    api_key_env: BP_API_KEY_1H
    secret_env: BP_SECRET_1H
    
    take_profit_pct: 3.2
    stop_loss_pct: 1.8
    trailing_stop_pct: 1.3
    arm_trailing_stop_pct: 1.1
    use_trailing_stop: true

    #position sizing
    default_order_size_usdc: 100.0      # Buy $100 per order
    max_position_size_pct: 40.0         # Max 40% of portfolio per symbol
    
    # Risk management
    max_open_positions: 3               # Max 5 concurrent positions
    max_portfolio_exposure_pct: 100.0    # Max 80% in positions total

    use_market_regime_filter: true

    # ========================================
    # MULTI-TIMEFRAME STRATEGY (4h + 1h)
    # ========================================
    # Signal generation on 1h bars
    enable_signal_generation: false
    signal_timeframe: "60"           # 1h execution timeframe
    signal_cooldown_seconds: 1800    # 30min between signals
    min_signal_confidence: 75.0      # Higher bar for 1h
    min_volume_ratio: 1.1            # 10% above average

    # ========================================
    # 4H TREND AUTHORITY VALIDATION
    # ========================================
    # This validates the HIGHER timeframe (4h) for trend confirmation
    use_trend_filter: true
    trend_timeframe: "240"  # 4h bars
    
    trend_indicators:
      # 1. EMA20 must be above EMA50 on 4h
      - type: "ema_cross"
        params: {fast: 20, slow: 50}
      # 2. Price must be above EMA50 on 4h
      - type: "price_vs_ema"
        params: 
          ema: 50              # Check vs EMA50
          min_gap_pct: 1.0     # Must be at/above (1% gap required)
      
      # 3. EMA20 must be rising on 4h (NEW)
      - type: "ema_slope"
        params:
          ema: 20              # Check EMA20 slope
          direction: "rising"  # Must be rising
          min_slope_pct: 0.01  # At least 0.01% increase
      
      # 4. RSI >= 52 on 4h with momentum
      - type: "rsi_threshold"
        params: 
          period: 14
          min_value: 54           # Higher threshold for 4h
          use_momentum: true
          early_threshold: 45     # Early momentum for 4h
      
      # 5. Block 4h RSI indecision zone 48-52 (NEW)
      - type: "rsi_range"
        params:
          min: 48
          max: 52
          invert: false  # Block when IN this range
          momentum_override_threshold: 1.5  # NEW: Allow if momentum > 2.0
      
      # 6. Prevent EMA20/EMA50 crossover on 4h (NEW)
      # Blocks if EMAs are too close (within 0.3%)
      - type: "ema_gap"
        params:
          min_gap_pct: 0.3  # EMAs must be >0.3% apart
          mode: "min"       # Minimum gap required
      
      # 7. Price vs VWAP on 4h
      - type: "price_vs_vwap"
        params: {}
    
    # Require ALL indicators to pass (conservative for 4h)
    min_indicators_required: 5
    
    # ========================================
    # 1H EXECUTION VALIDATION (via entry_indicators)
    # ========================================
    # These check the EXECUTION timeframe (1h) for entry timing
    
    use_entry_filter: true  # Enable execution timeframe validation
    entry_timeframe: "60"   # Same as signal_timeframe (1h)
    
    entry_indicators:
      # 1. Price >= EMA20 on 1h (NEW)
      - type: "price_vs_ema"
        params:
          ema: 20              # Check vs EMA20
          min_gap_pct: 0.0     # Must be at/above
      
      # 2. EMA20 >= EMA50 on 1h
      - type: "ema_cross"
        params: {fast: 20, slow: 50, use_slope=true}
      
      # 3. RSI >= 50 on 1h
      - type: "rsi_threshold"
        params:
          period: 14
          min_value: 55
          use_momentum: true
          early_threshold: 42
      
      # 4. Price vs VWAP on 1h
      - type: "price_vs_vwap"
        params: {}
    
    # Require 3/4 entry indicators (slightly more lenient for execution)
    min_entry_indicators_required: 3
    
    use_atr_filter: false

  15m_MB_ATR:
    enabled: true
    api_key_env: BP_API_KEY_1M_ATR
    secret_env: BP_SECRET_1M_ATR

    take_profit_pct: 1.2
    stop_loss_pct: 0.7
    trailing_stop_pct: 0.6
    arm_trailing_stop_pct: 0.7
    use_trailing_stop: true

    #position sizing
    default_order_size_usdc: 100.0      # Buy $100 per order
    max_position_size_pct: 40.0         # Max 40% of portfolio per symbol
    
    # Risk management
    max_open_positions: 3               # Max concurrent positions per token
    max_portfolio_exposure_pct: 100.0    # Max 100% in positions total

    use_market_regime_filter: false

    # 🎯 SIGNAL GENERATION SETTINGS (NEW)
    enable_signal_generation: false    # Enable automated signal generation
    signal_timeframe: "15"           # Timeframe for entry signals
    signal_cooldown_seconds: 600      # Wait 10min between signals for same symbol
    min_signal_confidence: 70.0       # Only trade signals >= 75% confidence
    min_volume_ratio: 1.1             # Require 10% above average volume

    # Trend filters
    use_trend_filter: true
    trend_timeframe: "60"  # Check 60 (1hr) trend for 15m trades
    trend_indicators:
      - type: "ema_cross"
        params: 
          fast: 20
          slow: 50
          use_slope: true
          min_slope_pct: 0.01
      - type: ema_gap
        params:
          min_gap_pct: 0.3
          mode: min
      - type: ema_gap
        params:
          min_gap_pct: 3.0
          mode: max
      - type: rsi_threshold
        params:
          min_value: 52
          use_momentum: false
    min_indicators_required: 3  # Require 3/4 (stricter)

    use_entry_filter: true
    entry_timeframe: "15"  # Same as signal_timeframe for single-TF strategy
    entry_indicators:
      - type: "price_vs_ema"  # NEW: Price must be at/above EMA20
        params:
          ema: 20
          min_gap_pct: -1.0
      - type: "rsi_range"  # NEW: Block RSI indecision zone
        params:
          min: 46
          max: 52
          invert: false
          momentum_override_threshold: 1.5  # NEW: Allow if momentum > 2.0
    min_entry_indicators_required: 4  # Require 4/5

    # ATR filter (volatility)
    use_atr_filter: false
    atr_timeframe: "15m"
    atr_threshold: 1.15
    atr_filter_mode: "require_low"
    # Trend-based exit (intelligent)
    use_trend_invalidation_exit: true
    min_position_age_for_trend_check: 6  # hours
    # Time-based invalidation and max position backstop (last resort)
    max_position_hours: 18  # Force exit if stuck

