profiles:
  default:
    display_name: "signal_trading_15m"
    enabled: true
    api_key_env: BACKPACK_API_KEY
    secret_env: SECRET

    strategy_type: trend_following

    take_profit_pct: 1.8
    stop_loss_pct: 1.2
    trailing_stop_pct: 0.8
    arm_trailing_stop_pct: 0.9      # Only arm after a confirmed move, not on small bounces
    use_trailing_stop: true

    # Position sizing
    default_order_size_usdc: 100.0
    max_position_size_pct: 40.0

    # Risk management
    max_open_positions: 2
    max_portfolio_exposure_pct: 100.0

    use_market_regime_filter: true

    # Signal generation
    enable_signal_generation: true
    signal_timeframe: "15"
    signal_cooldown_seconds: 900
    min_signal_confidence: 72.0
    min_volume_ratio: 1.0             # Require slightly above-average volume — trends need participation

    use_trend_filter: true
    trend_timeframe: "60"
    trend_indicators:

      # 1. EMA20 must be actively rising on 1h — not just flat.
      - type: "ema_slope"
        params:
          ema: 20
          direction: "not_falling"
          min_slope_pct: 0.01
          hard_stop: true
      - type: "bollinger_bands"
        params:
          band: "lower"
          mode: "pct_b"
          min_pct_b: 0.05
          max_pct_b: 0.95
          hard_stop: true

      # 2. EMA cross: EMA20 must be above EMA50 on the 1h.
      #- type: "ema_cross"
      #  params:
      #    hard_stop: true

      # 3. ADX >= 20 on 1h confirms a real trend exists (not ranging).
      - type: "adx_regime"
        params:
          min_adx: 23
          max_adx: 60             # No ceiling — strong trends are fine
          hard_stop: true
      # 4. 60m trend filter — replace existing rsi_overbought with lookback version:
      - type: "rsi_overbought"
        params:
          min_value: 68
          lookback_candles: 5     # Blocks T3 (69.3 in history), passes T1 (max 65.0)
          hard_stop: true
    
    min_indicators_required: 3

    use_entry_filter: true
    entry_timeframe: "15"

    entry_indicators:

      - type: "ema_gap"
        params:
          min_gap_pct: 0.15
          mode: "min"
          hard_stop: true
      - type: "price_vs_ema"
        params:
          ema: 20
          min_gap_pct: -1.5
          max_gap_pct: 2.0
          hard_stop: true
      - type: "bollinger_bands"
        params:
          band: "lower"
          mode: "pct_b"
          max_pct_b: 0.90
          hard_stop: true
      - type: "rsi_overbought"
        params:
          min_value: 68
          lookback_candles: 6
          hard_stop: true
      - type: "rsi_reversal_momentum"
        params:
          lookback_candles: 10
          oversold_threshold: 48    # Raised from 50 — catches the Feb28 15:03 dip to 47
          current_min: 36
          min_jump: 3.0
          require_sustained: false
          hard_stop: false          # NOT a hard stop — scoring indicator

      # Path B: Trend continuation — RSI holding in bullish zone (50–68)
      # Passes when RSI is between 50-67 and momentum is not falling.
      # No dip required — just sustained trend-level RSI.
      - type: "rsi_range"
        params:
          min: 50
          max: 67
          invert: true              # invert:true = PASS when RSI IS in range
          hard_stop: false
      # ── CANDLE CONFIRMATION GROUP (need at least 1 of 3) ───────
      # The 4 hard stops above confirm position and momentum but don't
      # confirm the exact moment the pullback is ending.
      # At least 1 of these 3 must pass to confirm the turn is happening

      # 5. Bullish engulfing — strongest reversal signal.
      - type: "reversal_candle"
        params:
          pattern: "engulfing"
          max_drop_from_close_pct: 0.6

      # 6. Bull close — candle closed in the upper 55%+ of its own range.
      #    Even a red candle that closes near its high shows buyers absorbed
      #    sell pressure. Fires earlier than engulfing and catches the
      #    pullback low more precisely.
      - type: "reversal_candle"
        params:
          pattern: "bull_close"
          min_close_pct: 0.55
          max_drop_from_close_pct: 0.6

      # 7. Higher low — most recent closed candle's low is above the prior low.
      #    Selling pressure is waning: each dip finds support slightly higher.
      #    Works even when both candles are red — the low is what matters.
      #    Complements bull_close: bull_close catches the candle body turning,
      #    higher_low catches the wick structure turning.
      - type: "reversal_candle"
        params:
          pattern: "higher_low"
          require_bull: false
          max_drop_from_close_pct: 0.6

    # 4 hard stops + 1 candle confirmation = 5 minimum
    # Passes if all hard stops pass + at least 1 candle pattern fires
    min_entry_indicators_required: 6

    use_atr_filter: false
     # Trend-based exit (intelligent)
    use_trend_invalidation_exit: true
    trend_invalidation_indicators: entry #trend or entry
    min_position_age_for_trend_check: 60  # minutes
    # Time-based invalidation and max position backstop (last resort)
    max_position_hours: 18  # Force exit if stuck

  profile3:
    display_name: "swing_4h1h_simple"
    enabled: true
    api_key_env: BP_API_KEY_1M
    secret_env: BP_SECRET_1M
    
    strategy_type: trend_following

    take_profit_pct: 6.0        # Target 8% gains on swings
    stop_loss_pct: 4.0          # 4% initial stop (wider for volatility)
    trailing_stop_pct: 3.5      # Trail with 3% buffer
    arm_trailing_stop_pct: 3.0  # Arm TSL after 4% gain
    use_trailing_stop: true

    #position sizing
    default_order_size_usdc: 100.0      # Buy $100 per order
    max_position_size_pct: 50.0         # Max 40% of portfolio per symbol
    
    # Risk management
    max_open_positions: 1               # Max 5 concurrent positions
    max_portfolio_exposure_pct: 100.0    # Max 80% in positions total

    use_market_regime_filter: true

    # ========================================
    # MULTI-TIMEFRAME STRATEGY (4h + 1h)
    # ========================================
    # Signal generation on 1h bars
    enable_signal_generation: true
    signal_timeframe: "60"           # 1h execution timeframe
    signal_cooldown_seconds: 3600    # 1h between signals
    min_signal_confidence: 78.0      # Higher bar for 1h
    min_volume_ratio: 1.3            # 10% above average

    # ========================================
    # 4H TREND AUTHORITY VALIDATION
    # ========================================
    # This validates the HIGHER timeframe (4h) for trend confirmation
    use_trend_filter: true
    trend_timeframe: "240"  # 4h bars
    
    trend_indicators:
      - type: "rsi_reversal_momentum"
        params:
          lookback_candles: 8        # Last 20 hours (5 x 4H)
          oversold_threshold: 45      # stretched to 45 to catch more swings
          current_min: 36             # Current must be >35
          min_jump: 4.0               # Must have jumped >5 at some point
          require_sustained: true     # Must be rising for 2+ candles
          sustained_rise_mode: "net"
          hard_stop: true             # BLOCK if fails
      
      # 2. RSI NOT OVERBOUGHT (SAFETY)
      - type: "rsi_overbought"
        params:
          min_value: 65
          hard_stop: true
      
    # STRICT: Need 3/4 (all except maybe EMA slope)
    min_indicators_required: 2
    
    # ========================================
    # 1H EXECUTION VALIDATION (via entry_indicators)
    # ========================================
    # These check the EXECUTION timeframe (1h) for entry timing
    
    use_entry_filter: true  # Enable execution timeframe validation
    entry_timeframe: "60"   # Same as signal_timeframe (1h)
    
    entry_indicators:
      - type: "rsi_reversal_momentum"
        params:
          lookback_candles: 15        # Last 5 hours
          oversold_threshold: 45      # Less extreme on 1H
          current_min: 38             # Current must be >35
          min_jump: 3.0               # Smaller jump ok on 1H
          require_sustained: true
          sustained_rise_mode: "net"
          hard_stop: true
      
      # 2. 1H RSI NOT TOO HOT
      # Make sure we're not chasing
      - type: "rsi_overbought"
        params:
          min_value: 62
          hard_stop: true
      
      # 3. PRICE VS EMA20 (LESS RESTRICTIVE)
      - type: "price_vs_ema"
        params:
          ema: 20
          min_gap_pct: -10.0
          max_gap_pct: 6.0
      
      # 4. VOLUME CONFIRMATION
      - type: "volume_spike"
        params:
          min_ratio: 1.0              # At least elevated
          max_ratio: 8.0

      - type: "bollinger_bands"
        params:
          band: "upper"
          mode: "pct_b"
          max_pct_b: 1.10    # Block if 60m price already above 1.10 of band
          hard_stop: true

    # Need 4/5 (all except maybe one)
    min_entry_indicators_required: 4
        
    use_atr_filter: false
    use_trend_invalidation_exit: true
    trend_invalidation_indicators: entry
    min_position_age_for_trend_check: 240
    
    max_position_hours: 72

  15m_MB_ATR:
    display_name: "mean_reversion_profile"
    enabled: true
    api_key_env: BP_API_KEY_1M_ATR
    secret_env: BP_SECRET_1M_ATR
    
    strategy_type: mean_reversion

    take_profit_pct: 1
    stop_loss_pct: 1
    trailing_stop_pct: 0.5
    arm_trailing_stop_pct: 0.5
    use_trailing_stop: true

    #position sizing
    default_order_size_usdc: 100.0      # Buy $100 per order
    max_position_size_pct: 30.0         # Max 30% of portfolio per symbol

    # Risk management
    max_open_positions: 1               # Max concurrent positions per token
    max_portfolio_exposure_pct: 100.0    # Max 100% in positions total

    use_market_regime_filter: false

    # 🎯 SIGNAL GENERATION SETTINGS (NEW)
    enable_signal_generation: true    # Enable automated signal generation
    signal_timeframe: "15"           # Timeframe for entry signals
    signal_cooldown_seconds: 900      # Wait 15min between signals for same symbol
    min_signal_confidence: 75.0       # Only trade signals >= 75% confidence
    min_volume_ratio: 1.2             # Require 20% above average volume

    # Trend filters
    use_trend_filter: false

    use_entry_filter: true
    entry_timeframe: "15"  # Same as signal_timeframe for single-TF strategy
    entry_indicators:
      # 1. RSI oversold and turning up
      - type: "rsi_reversal_momentum"
        params:
          lookback_candles: 6        # Last X candles
          oversold_threshold: 33      # was below this in past X candles
          current_min: 38             # Currently above this 
          min_jump: 4.0               # Jumped by at least this much in 1 candle
          require_sustained: true     # Last 2 candles have risen
          hard_stop: true

      # 2. Price below VWAP (stretched)
      - type: "price_below_vwap"
        params:
          min_gap_pct: -0.7       # At least 1% below
          max_gap_pct: -8.0       # Not more than 8% (too risky)
      
      # 3. Price extended below EMA20
      - type: "price_extended_below_ema"
        params:
          ema: 20
          min_gap_pct: -0.7       # at least below ema
          max_gap_pct: -10.0
      
      # 4. Volume spike (capitulation)
      - type: "volume_spike"
        params:
          min_ratio: 1.1
          max_ratio: 5.0
      
      # 5. Bollinger Band touch (if you implement it)
      - type: "bollinger_bands"
        params:
          band: "lower"
          mode: "breach"
          lookback_candles: 6        # Last X candles
      
      # 6. NOT overbought on higher timeframe (sanity check)
      - type: "rsi_overbought"
        params:
          min_value: 65  # Fail if RSI > 70 (don't buy tops)

      # 7. NEW: Reversal candle — hammer pattern confirms buyer absorption
      #    Long lower wick = sellers tried to push lower, buyers rejected it.
      #    Timing signal: we're not catching a knife, the candle shows the turn.
      #    min_body_pct: 0.08 allows small-body hammers (common in crypto)
      #    Not a hard_stop — adds confidence when present, doesn't block when absent.
      - type: "reversal_candle"
        params:
          pattern: "hammer"
          min_body_pct: 0.08    
          max_drop_from_close_pct: 0.5

    min_entry_indicators_required: 4  # Need 4/5 or 4/6
    # ATR filter (volatility)
    use_atr_filter: false
    atr_timeframe: "15m"
    atr_threshold: 1.15
    atr_filter_mode: "require_low"
    # Trend-based exit (intelligent)
    use_trend_invalidation_exit: true
    trend_invalidation_indicators: mean_reversion #trend or entry
    min_position_age_for_trend_check: 20
    # Time-based invalidation and max position backstop (last resort)
    max_position_hours: 8  # Force exit if stuck

  15m_no_trend:
    display_name: "signals_no_1hrchecks"
    enabled: true
    api_key_env: BP_API_KEY_1H
    secret_env: BP_SECRET_1H

    strategy_type: trend_following

    take_profit_pct: 0.8
    stop_loss_pct: 0.7
    trailing_stop_pct: 0.5
    arm_trailing_stop_pct: 0.5
    use_trailing_stop: true

    #position sizing
    default_order_size_usdc: 100.0      # Buy $100 per order
    max_position_size_pct: 40.0         # Max 40% of portfolio per symbol
    
    # Risk management
    max_open_positions: 1               # Max concurrent positions per token
    max_portfolio_exposure_pct: 100.0    # Max 100% in positions total

    use_market_regime_filter: true

    # 🎯 SIGNAL GENERATION SETTINGS (NEW)
    enable_signal_generation: true    # Enable automated signal generation
    signal_timeframe: "15"           # Timeframe for entry signals
    signal_cooldown_seconds: 900      # Wait 15min between signals for same symbol
    min_signal_confidence: 70.0       # Only trade signals >= 75% confidence
    min_volume_ratio: 1.1             # Require 10% above average volume

    use_trend_filter: true
    trend_timeframe: "60"
    trend_indicators:

      # 1. EMA20 must be actively rising on 1h — not just flat.
      - type: "ema_slope"
        params:
          ema: 20
          direction: "not_falling"
          min_slope_pct: 0.01
          hard_stop: true
      - type: "bollinger_bands"
        params:
          band: "lower"
          mode: "pct_b"
          min_pct_b: -0.05
          max_pct_b: 0.95
          hard_stop: true

      # 2. EMA cross: EMA20 must be above EMA50 on the 1h.
      #- type: "ema_cross"
      #  params:
      #    hard_stop: true

      # 3. ADX >= 20 on 1h confirms a real trend exists (not ranging).
      - type: "adx_regime"
        params:
          min_adx: 20
          max_adx: 60             # No ceiling — strong trends are fine
          hard_stop: true
      # 4. 60m trend filter — replace existing rsi_overbought with lookback version:
      - type: "rsi_overbought"
        params:
          min_value: 68
          lookback_candles: 5     # Blocks T3 (69.3 in history), passes T1 (max 65.0)
          hard_stop: true
    
    min_indicators_required: 4

    use_entry_filter: true
    entry_timeframe: "15"

    entry_indicators:
      - type: "price_vs_ema"  # NEW: Price must be at/above EMA20
        params:
          ema: 20
          min_gap_pct: -0.5
          max_gap_pct: 1.5
      - type: "reversal_candle"
        params:
          pattern: "hammer"
          min_body_pct: 0.08    # Candle structure confirms buyer
          max_drop_from_close_pct: 0.5
      - type: "bollinger_bands"
        params:
          band: "lower"
          mode: "pct_b"
          min_pct_b: 0.05       # Don't buy below bottom band
          max_pct_b: 0.65       # Don't buy near top of band
      - type: "rsi_threshold"
        params:
          period: 14
          min_value: 57
          use_momentum: true
          early_threshold: 45
          hard_stop: true
      - type: "rsi_overbought"
        params:
          min_value: 63
          hard_stop: true
      - type: "price_vs_vwap"
        params: {}
    min_entry_indicators_required: 5

    # ATR filter (volatility)
    use_atr_filter: false
     # Trend-based exit (intelligent)
    use_trend_invalidation_exit: true
    trend_invalidation_indicators: entry #trend or entry
    min_position_age_for_trend_check: 45  # minutes
    # Time-based invalidation and max position backstop (last resort)
    max_position_hours: 12  # Force exit if stuck

  15m_MB:
    display_name: "range_trading"
    enabled: true
    api_key_env: BP_API_KEY_15M
    secret_env: BP_SECRET_15M

    strategy_type: range_trading

    take_profit_pct: 0.7
    stop_loss_pct: 0.60
    trailing_stop_pct: 0.35
    arm_trailing_stop_pct: 0.4
    use_trailing_stop: true

    #position sizing
    default_order_size_usdc: 100.0      # Buy $100 per order
    max_position_size_pct: 40.0         # Max 40% of portfolio per symbol
    # Risk management
    max_open_positions: 1               # Max concurrent positions per token
    max_portfolio_exposure_pct: 100.0    # Max 100% in positions total

    use_market_regime_filter: true

    # 🎯 SIGNAL GENERATION SETTINGS (NEW)
    enable_signal_generation: true    # Enable automated signal generation
    signal_timeframe: "15"           # Timeframe for entry signals
    signal_cooldown_seconds: 600      # Wait 15min between signals for same symbol
    min_signal_confidence: 65.0       # Only trade signals >= 75% confidence
    min_volume_ratio: 0.8             # Require 10% above average volume

    # Trend filters
    use_trend_filter: true
    trend_timeframe: "60"  # Check 60 (1hr) trend for 15m trades
    trend_indicators:
      - type: "ema_slope"  # NEW: Ensure 60m trend is rising
        params:
          ema: 20
          direction: "not_falling"
          min_slope_pct: 0.01
      - type: "rsi_threshold"
        params: 
          period: 14
          min_value: 35
          use_momentum: false
      - type: "rsi_overbought"
        params:
          min_value: 60
          hard_stop: true
      - type: "bollinger_bands"
        params:
          band: "lower"
          mode: "pct_b"
          max_pct_b: 0.80    # Block if 60m price already in top 20% of its band
          hard_stop: true
    min_indicators_required: 4

    use_entry_filter: true
    entry_timeframe: "15"  # Same as signal_timeframe for single-TF strategy
    entry_indicators:

      # ── HARD GATES (4 total) ─────────────────────────────────────────────
      # All 4 must pass — each counts 1 toward the score when passing.
      # A single failure here blocks the trade immediately.

      # 1. RSI not too low — avoids catching a knife in a real breakdown.
      #    No momentum check: ranging RSI oscillates in a narrow band and
      #    momentum readings are too noisy to be useful here.
      - type: "rsi_threshold"
        params:
          period: 14
          min_value: 35
          use_momentum: false
          hard_stop: true

      # 2. RSI not overbought — don't buy near the top of the range.
      - type: "rsi_overbought"
        params:
          min_value: 62
          hard_stop: true

      # 3. Price below VWAP — confirms we are at the dip, not chasing.
      #    Promoted to hard_stop: if price is above VWAP this is not a
      #    range-low entry at all.
      - type: "price_below_vwap"
        params:
          min_gap_pct: -0.15    # at least 0.15% below VWAP
          max_gap_pct: -2.0     # not more than 2% below (too extended)
          hard_stop: true

      # 4. BB %B in lower portion of the band — price near range floor.
      #    Promoted to hard_stop: positional requirement, not optional.
      - type: "bollinger_bands"
        params:
          band: "lower"
          mode: "pct_b"
          min_pct_b: 0.05       # don't enter below the band (possible breakdown)
          max_pct_b: 0.45       # price in lower 40% of the band
          hard_stop: true

      # ── EXHAUSTION GROUP (need at least 1 of these 3) ───────────────────
      # The 4 hard stops above are all positional/directional-agnostic —
      # they are consistent with a market still in free-fall.
      # At least 1 of these 3 must pass to confirm the fall is STALLING.
      # Enforced by min_entry_indicators_required: 5 (4 hard stops + 1 here).

      # 5. Higher low — most recent closed candle's low is above the previous
      #    closed candle's low. Selling exhaustion: each dip finds support
      #    slightly higher. Works even when both candles are red.
      #    Uses _candle_history (two confirmed closed candles).
      - type: "reversal_candle"
        params:
          pattern: "higher_low"
          require_bull: false   # both candles can be red — low is what matters
          max_drop_from_close_pct: 0.5
      # 6. Bull close — candle closed in the upper portion of its own range.
      #    Even a red candle shows buyers absorbed sell pressure before close.
      #    Uses prev_candle (single confirmed closed candle).
      - type: "reversal_candle"
        params:
          pattern: "bull_close"
          min_close_pct: 0.55   # closed in top 45% of its range
          max_drop_from_close_pct: 0.5

      # 7. Doji — indecision at the range low, neither side in control.
      #    Often fires 1-2 candles before higher_low would form, giving
      #    the earliest possible entry signal.
      #    Uses prev_candle (single confirmed closed candle).
      - type: "reversal_candle"
        params:
          pattern: "doji"
          max_body_pct: 0.2    # body <= 35% of total candle range
          max_drop_from_close_pct: 0.5

    min_entry_indicators_required: 5

    # ATR filter (volatility)
    use_atr_filter: false
    atr_timeframe: "15m"
    atr_threshold: 1.5
    atr_filter_mode: "require_low"

     # Trend-based exit (intelligent)
    use_trend_invalidation_exit: false
    max_position_hours: 4  # Force exit if stuck


