services:
  - type: web
    name: trading-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BACKPACK_API_KEY
        sync: false
      - key: BACKPACK_PRIVATE_KEY
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: JWT_REFRESH_EXPIRE_HR
        value: "336"